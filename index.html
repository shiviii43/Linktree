<!DOCTYPE html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linktree</title>
    <link rel="icon" href="images/ico.png" type="image/x-icon"/>
    <link href="style.css" rel="stylesheet" type="text/css">
</head>
<body>
    <div class="page">
        <div class="profile-picture">
            <img src="images/me1.jpg" alt="Avatar" id="icon"></img>
        </div>
        <div class="info-box">
            <h2>Shivansh Harbola</h2>
            <h5 id="description">Unlock my universe: socials, projects, musings, all easily accessible. 🚀</h5>
        </div>
        <div class="button-box">
            <div class="link-buttons">
                <a target="_blank" href="https://www.instagram.com/shivanshharbola_/">
                    <button class="button1" >Instagram</button><br>
                </a>
            </div>
            <div class="link-buttons">
                <a target="_blank" href="https://www.linkedin.com/in/shivanshharbola19?lipi=urn%3Ali%3Apage%3Ad_flagship3_profile_view_base_contact_details%3B6e7zsyrqQq2hs0azuFQ%2Fkg%3D%3D">
                    <button class="button2">LinkedIn</button><br>
                </a>
                
            </div>
            <div class="link-buttons">
                <a target="_blank" href="https://leetcode.com/u/shivanshharbola/">
                    <button class="button3">LeetCode</button><br>
                </a>
            </div>
            <div class="link-buttons">
                <a id="email-link" href="#">
                    <button class="button4">Email Me</button><br>    
                </a>
            </div>
            <script>
                const emailLink = document.getElementById("email-link");
                const email = "shivanshharbola190259@gmail.com";

                if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
                    emailLink.href = "mailto:" + email;
                }
                else {
                    emailLink.href ="https://mail.google.com/mail/?view=cm&fs=1&to=" + email;
                    emailLink.target = "_blank";
                    emailLink.rel = "noopener noreferrer";
                }
            </script>
            <div class="link-buttons">
                <a target="_blank" href="https://github.com/shiviii43">
                    <button class="button5">GitHub</button><br>
                </a>
            </div>
            <div class="link-buttons">
                <a target="_blank" href="https://drive.google.com/file/d/1XdBO4JsaH5cM8EYxe3dhNydlc0Solng7/view?usp=sharing">
                    <button class="button6">Resume</button><br>
                </a>
            </div>
        </div>
    </div>
    <script>
        const links = document.querySelectorAll(".link-buttons a");
        const icon = document.getElementById("icon");

        links.forEach(link => {
            link.addEventListener("click", function (event) {
                if (window.matchMedia("(hover: none)").matches) {
                    const button = this.querySelector("button");
                    // Avoiding the delay if email is clicked
                    if (this.id === "email-link") {
                        button.classList.add("button-tap-effect");
                        setTimeout(() => {
                            button.classList.remove("button-tap-effect");
                        }, 500);
                        return;
                    }
                    //Any other Link buttom clicked
                    event.preventDefault();
                    const destination = this.href;
                    button.classList.add("button-tap-effect");
                    setTimeout(() => {
                        button.classList.remove("button-tap-effect");
                        window.open(destination, "_blank");
                    }, 500);
                }
            });
        });
        //Profile Picture onclick delay
        icon.addEventListener("click", function () {
            if (window.matchMedia("(hover: none)").matches) {
                this.classList.add("icon-tap-effect");
                setTimeout(() => {
                    this.classList.remove("icon-tap-effect");
                }, 4000);
            }
        });
    </script>
</body>
</html>
